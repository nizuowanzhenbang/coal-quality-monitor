name: Quality checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx ruff
      - name: Check Python syntax and undefined names
        run: python -m ruff check backend --select E9,F63,F7,F82
      - name: Regression tests
        run: cd backend && python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Contract status render regressions
        run: npm test
      - name: Type check and production build
        run: npm run build
  coal_energy_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout fixed energy peer
        uses: actions/checkout@v4
        with:
          repository: nizuowanzhenbang/coal-unit-efficiency
          ref: 30e8e6af92d796d6889875ec55b1de24c1ca13fe
          path: energy-peer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: |
          python -m venv "$RUNNER_TEMP/quality-contract-env"
          python -m venv "$RUNNER_TEMP/energy-contract-env"
          "$RUNNER_TEMP/quality-contract-env/bin/python" -m pip install -r backend/requirements.txt
          "$RUNNER_TEMP/energy-contract-env/bin/python" -m pip install -r energy-peer/backend/requirements.txt
      - name: Real coal export to energy preview contract
        working-directory: backend
        env:
          ENERGY_PEER_ROOT: ${{ github.workspace }}/energy-peer
          ENERGY_PEER_PYTHON: ${{ runner.temp }}/energy-contract-env/bin/python
        run: '"$RUNNER_TEMP/quality-contract-env/bin/python" -m pytest tests/contract_coal_energy.py -q'
